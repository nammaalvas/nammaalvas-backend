name: Deploy Fullstack App to Single Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Checkout Frontend Repository
        uses: actions/checkout@v4
        with:
          repository: 'nammaalvas/nammaalvas-frontend'
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          path: frontend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Bundle Frontend into Backend
        run: |
          mkdir -p backend/public_dist
          cp -r frontend/dist/* backend/public_dist/

      - name: Install Backend Production Dependencies
        run: |
          cd backend
          npm ci --only=production

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME || 'aiet-verse-app' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./backend
