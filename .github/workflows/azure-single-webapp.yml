name: Deploy Fullstack App to Single Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd ../Aiet-Verse-Frontend || cd Aiet-Verse-Frontend || cd ../*Frontend*
          npm ci
          npm run build

      - name: Bundle Frontend into Backend
        run: |
          mkdir -p public_dist
          cp -r ../Aiet-Verse-Frontend/dist/* ./public_dist/ || cp -r ./Aiet-Verse-Frontend/dist/* ./public_dist/

      - name: Install Backend Production Dependencies
        run: |
          npm ci --only=production

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME || 'aiet-verse-app' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
